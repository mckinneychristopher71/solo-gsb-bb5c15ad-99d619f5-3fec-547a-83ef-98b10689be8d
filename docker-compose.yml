services:
  api:
    build: .
    image: coldchain-audit:1.1.0
    container_name: coldchain-audit
    labels:
      org.opencontainers.image.title: "coldchain-audit-api"
      org.opencontainers.image.version: "1.1.0"
    ports:
      - "8000:8000"
    environment:
      COLDCHAIN_DB_PATH: /data/coldchain.db
      # 可选：覆盖默认滞回阈值与采样间隔上限
      # COLDCHAIN_DEFAULT_HYSTERESIS: "0.5"
      # COLDCHAIN_DEFAULT_MAX_INTERVAL: "900"
    volumes:
      - coldchain-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  coldchain-data:
